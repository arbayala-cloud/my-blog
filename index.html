    <div class="cgrid"><label class="cc"><input type="color" data-cc="bg"><span>Page background</span></label><label class="cc"><input type="color" data-cc="card"><span>Post background</span></label><label class="cc"><input type="color" data-cc="fg"><span>Text</span></label><label class="cc"><input type="color" data-cc="title"><span>Titles</span></label><label class="cc"><input type="color" data-cc="acc"><span>Accent (links, eProps, labels)</span></label><label class="cc"><input type="color" data-cc="bar"><span>Top bar</span></label></div>
    <div class="msg" id="cnote" style="min-height:0"></div><p class="mutd" id="cdhint" style="margin:6px 0 0"></p>
    <div class="row" style="margin-top:8px"><button id="ccx">Reset to skin</button></div></div>
  <div class="cbox"><h4>Font</h4><div class="fonts">${Object.entries(FONTS).map(([k,f])=>`<label class="fo"><input type="radio" name="fo" value="${k}" ${(L.font||'verdana')===k?'checked':''}><span style="font-family:${f.f}">${f.n}</span></label>`).join('')}</div></div>
  <div class="cbox"><h4>Header</h4><label class="l">Subtitle (optional)</label><input id="st" value="${esc(L.subtitle||'')}" placeholder="Leave blank for none">
    <label class="l">Banner photo (optional)</label><div class="row" style="margin:0"><label class="btn">Choose banner<input type="file" accept="image/*" id="bn" hidden></label><button id="bnx" ${L.banner?'':'hidden'}>Remove banner</button></div></div>
  <div class="cbox"><h4>Profile</h4><div class="row" style="margin:0 0 6px"><label class="btn">Choose profile photo<input type="file" accept="image/*" id="pp2" hidden></label></div>
    <div id="adj" ${PROFILE.photo?'':'hidden'}><label class="l">Adjust photo: drag to move, slide to zoom</label><div class="adjf" id="adjf">${PROFILE.photo?imgTag(PROFILE.photo,'',1):''}</div>
    <div class="row" style="margin:8px 0 0;justify-content:center"><span class="sans" style="font-size:11px">Zoom</span><input type="range" id="zm" min="1" max="3" step="0.05" style="width:160px;padding:0"></div>
    <div class="nudge"><button data-n="0,-5" aria-label="Up"><svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button data-n="-5,0" aria-label="Left"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button data-n="5,0" aria-label="Right"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button data-n="0,5" aria-label="Down"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button id="pcen">Center</button></div></div>
    ${PFIELDS.map(([k,l])=>`<label class="l">${l}</label><input data-pf="${k}" value="${esc(F[k]||'')}">`).join('')}</div>
  <div class="row"><button class="pri" id="csv">Save</button><button id="crs">Reset to classic</button></div><div class="msg" id="msg"></div>`;
  let CM='L';const drawCC=()=>{const s=SKINS[L.skin||'classic'],base=CM==='D'?s.D:s.L,c=(L.colors||{})[CM]||{},defs={bg:base.bg,card:base.card,fg:base.fg,title:base.fg,acc:L.accent||base.lnk,bar:L.accent||base.bar};
    app.querySelectorAll('[data-cc]').forEach(i=>i.value=c[i.dataset.cc]||(CM==='D'&&!(L.colors||{}).D&&(L.colors||{}).L?'#222222':defs[i.dataset.cc]));
    $('#cnote').textContent=ADJ.length?'Adjusted for readability: '+ADJ.join(', ')+'.':'';$('#cdhint').textContent=CM==='D'&&!(L.colors||{}).D&&(L.colors||{}).L?'Dark mode is made automatically from your light colors. Pick here to set it yourself.':''};
  const live=()=>{setLook(L);app.querySelectorAll('.skin').forEach(b=>b.classList.toggle('on',b.dataset.sk===(L.skin||'classic')));drawCC()};
  setTimeout(()=>{$('#cmode').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;CM=b.dataset.m;$('#cmode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));setTheme(CM==='D'?'dark':'light');drawCC()};
    app.querySelectorAll('[data-cc]').forEach(i=>i.oninput=()=>{L.colors={...(L.colors||{})};L.colors[CM]={...(L.colors[CM]||{}),[i.dataset.cc]:i.value};setLook(L);$('#cnote').textContent=ADJ.length?'Adjusted for readability: '+ADJ.join(', ')+'.':'';});
    $('#ccx').onclick=()=>{delete L.colors;live()};drawCC()},0);
  app.querySelectorAll('.skin').forEach(b=>b.onclick=()=>{L.skin=b.dataset.sk;delete L.accent;$('#ac').value=SKINS[L.skin].L.bar;live()});
  $('#ac').oninput=e=>{L.accent=e.target.value;live()};$('#acx').onclick=()=>{delete L.accent;$('#ac').value=SKINS[L.skin||'classic'].L.bar;live()};
  app.querySelectorAll('[name=fo]').forEach(r=>r.onchange=()=>{L.font=r.value;live()});
  $('#st').oninput=e=>{L.subtitle=e.target.value.trim();live()};
  const up=async(f,pre)=>'drive:'+await mpUpload({name:pre+'-'+Date.now(),parents:['appDataFolder']},f,f.type||'application/octet-stream');
  $('#bn').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading banner';try{L.banner=await up(f,'banner');live();$('#bnx').hidden=false;$('#msg').textContent='Banner ready. Tap Save to keep it.'}catch(x){$('#msg').textContent='Upload failed. Please try again.'}};
  $('#bnx').onclick=()=>{delete L.banner;live();$('#bnx').hidden=true};
  let POS={x:50,y:25,z:1,...(PROFILE.photoPos||{})};const cl=v=>Math.max(0,Math.min(100,v));
  const drawPos=()=>{const i=$('#adjf img');if(i)i.setAttribute('style',pfStyle(POS));$('#zm').value=POS.z};drawPos();
  const fr=$('#adjf');let drag=null;
  fr.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:POS.x,py:POS.y};fr.setPointerCapture(e.pointerId);e.preventDefault()});
  fr.addEventListener('pointermove',e=>{if(!drag)return;const w=fr.clientWidth,hh=fr.clientHeight;POS.x=cl(drag.px-(e.clientX-drag.x)/w*100/POS.z);POS.y=cl(drag.py-(e.clientY-drag.y)/hh*100/POS.z);drawPos()});
  fr.addEventListener('pointerup',()=>drag=null);fr.addEventListener('pointercancel',()=>drag=null);
  $('#zm').oninput=e=>{POS.z=+e.target.value;drawPos()};
  app.querySelector('.nudge').onclick=e=>{const b=e.target.closest('[data-n]');if(b){const [dx,dy]=b.dataset.n.split(',').map(Number);POS.x=cl(POS.x+dx);POS.y=cl(POS.y+dy);drawPos()}};
  $('#pcen').onclick=()=>{POS={x:50,y:25,z:1};drawPos()};
  let PHOTO=null;$('#pp2').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading photo';try{PHOTO=await up(f,'profile');POS={x:50,y:25,z:1};$('#adj').hidden=false;$('#adjf').innerHTML=imgTag(PHOTO,'',1);drawPos();$('#msg').textContent='Photo ready. Adjust it, then tap Save.'}catch(x){$('#msg').textContent='Upload failed. Please try again.'}};
  $('#csv').onclick=async()=>{const fields={};app.querySelectorAll('[data-pf]').forEach(i=>fields[i.dataset.pf]=i.value.trim());$('#msg').textContent='Saving';
    try{await change(a=>{PROFILE={...PROFILE,look:L,fields,photoPos:POS,...(PHOTO?{photo:PHOTO}:{})};return a});setLook(L);side();$('#msg').textContent='Saved'}catch(x){$('#msg').textContent='Could not save. Please try again.'}};
  $('#crs').onclick=()=>{if(!confirm('Reset skin, accent, font and header to classic?'))return;L={};live();custom();$('#msg').textContent='Reset. Tap Save to keep it.'}}
async function route(){if(!LS.getItem('blog.em')){signin();return}
  try{await token(false)}catch(e){signin(e.message==='offline'?'You appear to be offline.':'Tap Continue to open your blog.');return}$('#mbtn').style.visibility='visible';
  const h=location.hash||'#/';let r='home';
  if(h.startsWith('#/page/'))home(h.slice(7));else if(h.startsWith('#/p/'))view(h.slice(4));else if(h.startsWith('#/tag/'))tagPage(decodeURIComponent(h.slice(6))),r='tags';else if(h==='#/tags')tags(),r='tags';
  else if(h==='#/archive')archive(),r='archive';else if(h==='#/write')write(),r='write';else if(h==='#/custom')custom(),r='custom';else home();
  side();document.querySelectorAll('.xbar a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r));scrollTo(0,0)}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

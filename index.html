<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashley's Blog</title><meta name="theme-color" content="#2f3e46"><link rel="manifest" href="manifest.json?v=2"><link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--fg:#2b2b2b;--mut:#6f6a62;--acc:#2f3e46;--gold:#a8864e;--line:#e4ded3}
[data-t=dark]{--bg:#16191b;--card:#1e2225;--fg:#e8e4dc;--mut:#9a958c;--acc:#c9d3d6;--gold:#c9a96e;--line:#2c3236}
@media(prefers-color-scheme:dark){[data-t=system]{--bg:#16191b;--card:#1e2225;--fg:#e8e4dc;--mut:#9a958c;--acc:#c9d3d6;--gold:#c9a96e;--line:#2c3236}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 Georgia,'Iowan Old Style',serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));z-index:5}
header a{color:var(--fg);text-decoration:none;font-size:20px;letter-spacing:.02em}
button,.btn{font:15px system-ui,sans-serif;background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}button.icon{border:0;padding:8px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:680px;margin:0 auto;padding:22px 18px 80px}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:9}.menu.on{display:block}
.menu nav{position:absolute;right:0;top:0;bottom:0;width:min(300px,85vw);background:var(--card);padding:22px;padding-top:max(22px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}
.menu nav a{color:var(--fg);text-decoration:none;font:17px system-ui,sans-serif;padding:12px 6px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.seg{display:flex;gap:6px;margin-top:14px;font-family:system-ui}.seg button{flex:1;justify-content:center}.seg button.on{background:var(--acc);color:var(--bg)}
.post{padding:6px 0 26px;border-bottom:1px solid var(--line);margin-bottom:22px}.post h2{margin:0 0 2px;font-weight:normal;font-size:26px;line-height:1.3}.post h2 a{color:var(--fg);text-decoration:none}
.date{color:var(--mut);font:14px system-ui,sans-serif;margin-bottom:12px}.more{color:var(--gold);font:15px system-ui;text-decoration:none}
.body img{max-width:100%;height:auto;border-radius:10px;display:block;margin:14px 0}.body p{margin:0 0 1em}
.empty{color:var(--mut);text-align:center;padding:50px 0;font-family:system-ui}
label{display:block;font:14px system-ui;color:var(--mut);margin:14px 0 6px}
input,textarea{width:100%;font:17px/1.6 Georgia,serif;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px}textarea{min-height:45vh;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.list .it span{flex:1}.msg{font:14px system-ui;color:var(--mut);min-height:20px;margin-top:8px}.tag{font:12px system-ui;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
</style></head><body data-t="system">
<header><a href="#/">Ashley's Blog</a><button class="icon" id="mbtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
<div class="menu" id="menu"><nav>
<a href="#/"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8"/></svg>Posts</a>
<a href="#/write"><svg class="i" viewBox="0 0 24 24"><path d="M5 19l1-4L16 5l3 3L9 18zM14 7l3 3"/></svg>Write</a>
<div style="font:14px system-ui;color:var(--mut);margin-top:18px">Appearance</div>
<div class="seg" id="seg"><button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="system">System</button></div>
<div style="margin-top:auto;font:12px system-ui;color:var(--mut)">Version 2026.10.31b</div></nav></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://pbkrwghuwqufosodcxtw.supabase.co',SB_KEY='sb_publishable_bzFGyPbxFyfgU4CQ72ryuQ_S4vwUvt2';
let sb=null;try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'blog-auth'}})}catch(e){}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
function render(b){return String(b||'').split(/\n{2,}/).map(p=>{const m=p.trim().match(/^!\[(.*?)\]\((https:\/\/[^\s)]+)\)$/);return m?`<img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">`:'<p>'+esc(p).replace(/!\[(.*?)\]\((https:\/\/[^\s)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">').replace(/\n/g,'<br>')+'</p>'}).join('')}
function plain(b){return String(b||'').replace(/!\[.*?\]\(.*?\)/g,'').trim()}
// theme
function setTheme(v){document.body.dataset.t=v;localStorage.blogTheme=v;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
setTheme(localStorage.blogTheme||'system');$('#seg').onclick=e=>{if(e.target.dataset.v)setTheme(e.target.dataset.v)};
$('#mbtn').onclick=()=>$('#menu').classList.add('on');$('#menu').onclick=e=>{if(e.target.id==='menu'||e.target.closest('a'))$('#menu').classList.remove('on')};
async function list(){app.innerHTML='<div class="empty">Loading</div>';
  const {data,error}=await sb.from('posts').select('id,title,body,created_at').eq('published',true).order('created_at',{ascending:false});
  if(error){app.innerHTML='<div class="empty">Posts are not available yet.</div>';return}
  if(!data.length){app.innerHTML='<div class="empty">No posts yet.</div>';return}
  app.innerHTML=data.map(p=>{const t=plain(p.body),long=t.length>600;const img=(p.body.match(/!\[.*?\]\((https:\/\/[^\s)]+)\)/)||[])[1];
   return `<article class="post"><h2><a href="#/p/${p.id}">${esc(p.title)||'Untitled'}</a></h2><div class="date">${fmt(p.created_at)}</div><div class="body">${long?(img?`<img src="${esc(img)}" loading="lazy">`:'')+'<p>'+esc(t.slice(0,600))+'...</p>':render(p.body)}</div>${long?`<a class="more" href="#/p/${p.id}">Continue reading</a>`:''}</article>`}).join('')}
async function view(id){const {data}=await sb.from('posts').select('*').eq('id',id).maybeSingle();
  app.innerHTML=data?`<article class="post" style="border:0"><h2>${esc(data.title)||'Untitled'}</h2><div class="date">${fmt(data.created_at)}</div><div class="body">${render(data.body)}</div></article><a class="more" href="#/">All posts</a>`:'<div class="empty">Post not found.</div>';scrollTo(0,0)}
async function write(){const {data:{session}}=await sb.auth.getSession();
  if(!session){app.innerHTML=`<h2 style="font-weight:normal">Sign in</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="pri" id="si">Sign in</button></div><div class="msg" id="msg"></div>`;
    $('#si').onclick=async()=>{$('#msg').textContent='Signing in';const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#msg').textContent=error.message;else write()};return}
  const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false});
  app.innerHTML=`<div class="row" style="margin:0 0 10px;justify-content:space-between"><h2 style="font-weight:normal;margin:0">Your posts</h2><button class="pri" id="nw"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New post</button></div>
  <div class="list">${error?'<div class="msg">'+esc(error.message)+'</div>':(data.map(p=>`<div class="it"><span>${esc(p.title)||'Untitled'}${p.published?'':'<span class="tag">Draft</span>'}<br><small class="date">${fmt(p.created_at)}</small></span><button data-e="${p.id}">Edit</button></div>`).join('')||'<div class="empty">No posts yet.</div>')}</div>
  <div class="row"><button id="bk"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download all posts</button><button id="so">Sign out</button></div>`;
  $('#nw').onclick=()=>edit();$('#so').onclick=async()=>{await sb.auth.signOut();write()};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(data.find(p=>p.id===b.dataset.e)));
  $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),posts:data},null,2)],{type:'application/json'}));a.download='blog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}}
function edit(p){p=p||{title:'',body:'',published:true};
  app.innerHTML=`<label>Title</label><input id="ti" value="${esc(p.title)}"><label>Post</label><textarea id="bo" placeholder="Write here. Leave a blank line between paragraphs.">${esc(p.body)}</textarea>
  <div class="row"><label class="btn" style="margin:0;color:var(--fg)"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 15l5-4 4 3 3-2 4 3"/><circle cx="15" cy="9" r="1.5"/></svg>Add photo<input type="file" accept="image/*" id="ph" hidden></label>
  <label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="pb" style="width:auto" ${p.published?'checked':''}>Published</label></div>
  <div class="row"><button class="pri" id="sv">Save</button><button id="cx">Cancel</button>${p.id?'<button id="dl" style="margin-left:auto">Delete</button>':''}</div><div class="msg" id="msg"></div>`;
  $('#cx').onclick=write;
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading photo';
    const path=Date.now()+'-'+f.name.replace(/[^\w.]+/g,'_');const {error}=await sb.storage.from('blog').upload(path,f,{contentType:f.type});
    if(error){$('#msg').textContent=error.message;return}const url=sb.storage.from('blog').getPublicUrl(path).data.publicUrl;
    const t=$('#bo'),i=t.selectionStart;t.value=t.value.slice(0,i)+'\n\n![]('+url+')\n\n'+t.value.slice(i);$('#msg').textContent='Photo added'};
  $('#sv').onclick=async()=>{$('#msg').textContent='Saving';const row={title:$('#ti').value.trim(),body:$('#bo').value,published:$('#pb').checked,updated_at:new Date().toISOString()};
    const r=p.id?await sb.from('posts').update(row).eq('id',p.id):await sb.from('posts').insert(row);if(r.error)$('#msg').textContent=r.error.message;else write()};
  if(p.id)$('#dl').onclick=async()=>{if(!confirm('Delete this post?'))return;const r=await sb.from('posts').delete().eq('id',p.id);if(r.error)$('#msg').textContent=r.error.message;else write()}}
function route(){if(!sb){app.innerHTML='<div class="empty">Could not load. Check your connection.</div>';return}const h=location.hash;
  if(h.startsWith('#/p/'))view(h.slice(4));else if(h==='#/write')write();else list()}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

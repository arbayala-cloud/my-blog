<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashley's Blog</title><meta name="theme-color" content="#3d74a5"><link rel="manifest" href="manifest.json?v=2"><link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Varela+Round&family=Fira+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Courier Prime";src:url(fonts/cp-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url(fonts/cp-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Courier Prime";src:url(fonts/cp-700-normal.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url(fonts/cp-700-italic.woff2) format("woff2");font-weight:700;font-style:italic;font-display:swap}

:root{
  --bg:#f0f0f0;
  --card:#ffffff;
  --fg:#222222;
  --mut:#666666;
  --acc:#3d74a5;
  --acc2:#333333;
  --gold:#666666;
  --line:#dddddd;
  --chip:#eeeeee;
  --lnk:#3d74a5;
  --bar:#3d74a5;
  --hd:#3d74a5;
  --ttl:#3d74a5;
  --bart:#ffffff;
  --hover:#f57d00;
  --ui:Arial,Helvetica,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:#f0f0f0;
  color:#222;
  font:16px/1.65 Georgia,"Times New Roman",Times,serif;
}
.sans{font-family:Arial,Helvetica,sans-serif}
a{color:#3d74a5;text-decoration:none}
a:hover{color:#f57d00;text-decoration:underline}
img{max-width:100%;height:auto}
::selection{background:#cde0f0}

/* Page wrapper — gray around a centered blog, like Blogger Simple */
.page{min-height:100vh;padding:16px 12px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.outer{
  max-width:1080px;
  margin:0 auto;
  background:#fff;
  border:1px solid #d4d4d4;
}

/* Blue header band */
.blog-header{background:#3d74a5;color:#fff}
.htitle{padding:22px 24px 16px}
.brand{
  font:normal 34px/1.2 Georgia,"Times New Roman",Times,serif;
  color:#fff;
  text-decoration:none;
  display:inline-block;
}
.brand:hover{color:#fff;text-decoration:none}
.xsub{font:14px/1.4 Georgia,serif;color:#e8f0f6;margin-top:6px}
.xsub[hidden]{display:none}

/* Tabs under the title, sitting on the white content */
.tabs-wrap{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  position:relative;
  padding:0 16px;
  background:#3d74a5;
}
.xbar,.xnav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}
.xbar a{
  color:#fff;
  text-decoration:none;
  font:13px/1 Arial,Helvetica,sans-serif;
  padding:9px 14px;
  display:inline-flex;
  align-items:center;
  min-height:34px;
  background:transparent;
}
.xbar a:hover{color:#fff;text-decoration:underline;background:transparent}
.xbar a.cur{background:#fff;color:#222;text-decoration:none}
.xbar a.cur:hover{color:#222;text-decoration:none}
.xr{display:flex;align-items:flex-end;margin-left:2px}
.mnb{
  font:13px/1 Arial,Helvetica,sans-serif;
  color:#fff;
  background:transparent;
  border:0;
  padding:9px 14px;
  min-height:34px;
  cursor:pointer;
  border-radius:0;
  display:inline-flex;
  align-items:center;
}
.mnb:hover{text-decoration:underline}
.mnb[aria-expanded=true]{background:#fff;color:#222;text-decoration:none}

button,.btn{
  font:13px Arial,Helvetica,sans-serif;
  background:#f0f0f0;
  border:1px solid #ccc;
  color:#222;
  border-radius:0;
  padding:6px 12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
button.pri{background:#3d74a5;color:#fff;border-color:#3d74a5}
button.pri:hover{background:#326391}
button.icon{border:0;background:none;padding:8px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.mnu{
  position:absolute;
  right:12px;
  top:100%;
  width:min(260px,calc(100vw - 24px));
  background:#fff;
  border:1px solid #ccc;
  padding:6px 0 10px;
  z-index:30;
  color:#222;
}
.mi{
  display:flex;align-items:center;gap:10px;
  width:100%;
  border:0;background:none;border-radius:0;
  color:#222;
  text-decoration:none;
  font:13px Arial,Helvetica,sans-serif;
  padding:9px 14px;
  text-align:left;
  cursor:pointer;
}
.mi:hover{background:#f0f0f0;color:#222;text-decoration:none}
.mi .i{color:#666}
.mlab{font:11px Arial,Helvetica,sans-serif;color:#666;padding:10px 14px 2px}
.seg{display:flex;gap:4px;padding:4px 14px 8px}
.seg button{flex:1;justify-content:center;padding:6px 4px;font-size:12px}
.seg button.on{background:#3d74a5;color:#fff;border-color:#3d74a5}
.msync{font:12px/1.45 Arial,Helvetica,sans-serif;color:#666;padding:8px 14px 4px;border-top:1px solid #e0e0e0;margin-top:6px}
.msync b{color:#222;font-weight:700}

/* Sync bar */
.syncbar{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 16px;
  padding:8px 16px;
  background:#fff8e1;
  border-bottom:1px solid #e6d9a8;
  font:13px/1.4 Arial,Helvetica,sans-serif;
  color:#222;
}
.syncbar[hidden]{display:none}
.syncbar button{min-height:32px}

.xhead{display:none}

/* Two columns */
.cols{
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:36px;
  background:#fff;
  padding:22px 24px 40px;
}
#side{display:block;min-width:0}
#side:empty{display:none}
main{min-width:0;max-width:none;margin:0;padding:0}

h1,h2,h3{font-family:Georgia,"Times New Roman",Times,serif;font-weight:normal;color:#222;line-height:1.3}
h1{font-size:1.7rem;margin:0 0 .5em}
h2{font-size:1.4rem;margin:0 0 .35em}
h3{font-size:1.25rem;margin:1.1em 0 .35em}

.pagehead{margin:0 0 20px}
.pagehead h1{margin:0;font-size:1.5rem;font-family:Arial,Helvetica,sans-serif;font-weight:bold}
.pagehead p{color:#666;margin:6px 0 0;font:13px/1.5 Arial,Helvetica,sans-serif}
.empty{color:#666;text-align:left;padding:20px 0;font-family:Arial,Helvetica,sans-serif}
.foot{
  background:#fff;
  border-top:1px solid #ddd;
  padding:14px 24px max(16px,env(safe-area-inset-bottom));
  text-align:center;
  color:#666;
  font:12px/1.5 Arial,Helvetica,sans-serif;
}

/* Blogger post: date header, blue title, body, gray footer */
.date-header,.day{
  font:11px/1.4 Arial,Helvetica,sans-serif;
  color:#666;
  text-transform:uppercase;
  letter-spacing:.08em;
  border-bottom:1px solid #ddd;
  padding:0 0 4px;
  margin:0 0 10px;
}
.entry{margin:0 0 32px;padding:0 0 4px}
.blog-posts .entry+.date-header,.entry+.entry{margin-top:8px}
.pt,.tlt,.bp-title,
.pt a,.tlt a,.bp-title a{
  font:normal 22px/1.3 Georgia,"Times New Roman",Times,serif;
  color:#3d74a5;
  text-decoration:none;
  margin:0 0 10px;
  display:block;
}
.pt a:hover,.tlt a:hover,.bp-title a:hover{color:#f57d00;text-decoration:underline}
.bp-title{margin:0 0 12px}
.body p{margin:0 0 1em}
.body img,.cover{max-width:100%;height:auto;display:block;margin:12px 0}
img.cover{width:100%;aspect-ratio:16/9;object-fit:cover;margin:0 0 1em}
.body .al-center{text-align:center}
.body .al-right{text-align:right}
.body ul,.body ol{margin:0 0 1em;padding-left:1.4em}
.body li{margin:.2em 0}
.body blockquote{
  margin:0 0 1em;
  padding:0 0 0 1em;
  border-left:3px solid #ddd;
  color:#333;
}
.body blockquote.al-center{border-left:0;padding-left:0}
.body a{color:#3d74a5}
.body a:hover{color:#f57d00}
.body h3{margin:1.2em 0 .4em;font-size:1.15rem}
.body h4.chap{
  font:bold 13px/1.4 Arial,Helvetica,sans-serif;
  color:#666;
  margin:1.6em 0 .7em;
  padding-top:1em;
  border-top:1px solid #ddd;
}
.body .vv{display:block}
.body .vl{display:block;margin:0 0 .35em}
.body .vn{
  font-size:.62em;
  color:#666;
  font-weight:700;
  margin-right:.35em;
  vertical-align:.45em;
  line-height:0;
  font-family:Arial,Helvetica,sans-serif;
}
.bp-body .vv{margin:1em 0}
.bp-cur,.mood{
  font:13px/1.5 Arial,Helvetica,sans-serif;
  color:#666;
  margin:14px 0 0;
  padding:4px 0 4px 10px;
  border-left:2px solid #ddd;
}
.cur2{font:13px/1.5 Arial,Helvetica,sans-serif;color:#666;margin:12px 0 0}
.ef,.bp-foot{
  margin:12px 0 0;
  padding:8px 0 0;
  border-top:1px dotted #ccc;
  font:12px/1.55 Arial,Helvetica,sans-serif;
  color:#666;
}
.ef a,.bp-foot a{color:#3d74a5}
.ef a:hover,.bp-foot a:hover{color:#f57d00;text-decoration:underline}
.rmore{font:12px Arial,Helvetica,sans-serif;color:#3d74a5}
.s{margin:0 .15em;color:#666}
.rtm{color:#666}
.heart{
  background:none;border:0;padding:0 0 0 2px;
  font:12px Arial,Helvetica,sans-serif;color:#666;
  display:inline-flex;align-items:center;gap:4px;
  min-height:auto;
}
.heart .i{width:12px;height:12px}
.heart.on svg{fill:currentColor}
.bp-nav{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:22px 0 0;
  padding-top:10px;
  border-top:1px solid #ddd;
  font:13px Arial,Helvetica,sans-serif;
}
.bp-nav a{color:#3d74a5;display:inline-flex;align-items:center;gap:4px}
.bkh{display:inline-flex;align-items:center;gap:4px;font:13px Arial,Helvetica,sans-serif}

/* Chips / tags */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{
  font:12px Arial,Helvetica,sans-serif;
  background:#f0f0f0;
  color:#222;
  border-radius:0;
  padding:3px 8px;
  text-decoration:none;
  border:1px solid #ddd;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:#3d74a5;color:#3d74a5;text-decoration:none}
.chip.x{display:inline-flex}
.tag{
  font:11px Arial,Helvetica,sans-serif;
  color:#666;
  border:1px solid #ccc;
  border-radius:0;
  padding:0 5px;
  margin-left:6px;
  font-weight:normal;
  vertical-align:middle;
}

/* Sidebar widgets */
.wg{margin:0 0 24px}
.wg h4{
  margin:0 0 8px;
  padding:0 0 5px;
  font:bold 13px/1.3 Arial,Helvetica,sans-serif;
  color:#333;
  border-bottom:1px solid #e0e0e0;
  text-transform:none;
  letter-spacing:0;
}
.wg h4 a{color:#333;text-decoration:none}
.wg h4 a:hover{color:#f57d00;text-decoration:underline}
.wi{font:13px/1.5 Arial,Helvetica,sans-serif;color:#222}
.sf{display:flex;gap:4px;align-items:stretch}
.sf input{
  flex:1;min-width:0;
  font:13px Arial,Helvetica,sans-serif;
  padding:5px 6px;
  border:1px solid #ccc;
  background:#fff;
  color:#222;
  border-radius:0;
  width:auto;
}
.sf button{
  font:13px Arial,Helvetica,sans-serif;
  background:#eee;
  border:1px solid #ccc;
  color:#222;
  padding:5px 10px;
  cursor:pointer;
  border-radius:0;
}
.sf button:hover{background:#e4e4e4}
.wg-tags a{
  display:block;
  padding:2px 0;
  font:13px Arial,Helvetica,sans-serif;
  color:#3d74a5;
  text-decoration:none;
}
.wg-tags a:hover{color:#f57d00;text-decoration:underline}
.wg-arch details{margin:0}
.wg-arch summary{
  cursor:pointer;
  font:13px Arial,Helvetica,sans-serif;
  color:#222;
  padding:3px 0;
  list-style:none;
}
.wg-arch summary::-webkit-details-marker{display:none}
.wg-arch summary::before{content:"\25B6";display:inline-block;width:1em;font-size:9px;color:#666;margin-right:4px}
.wg-arch details[open]>summary::before{content:"\25BC"}
.wg-arch .ma{margin-left:14px}
.wg-arch ul{margin:0;padding:0 0 4px 16px;list-style:none}
.wg-arch li{padding:1px 0;font:13px Arial,Helvetica,sans-serif}
.wg-arch a{color:#3d74a5;text-decoration:none}
.wg-arch a:hover{color:#f57d00;text-decoration:underline}

/* Search page */
.sbox{
  display:flex;align-items:center;gap:8px;
  border:1px solid #ccc;
  border-radius:0;
  padding:4px 8px 4px 10px;
  background:#fff;
  margin:0 0 10px;
}
.sbox .i{flex:none;color:#666}
.sbox input{
  border:0 !important;background:none !important;box-shadow:none !important;
  outline:0;flex:1;min-width:0;
  font:15px Arial,Helvetica,sans-serif;padding:8px 0;margin:0;color:#222;
}
.scount{font:13px Arial,Helvetica,sans-serif;color:#666;margin:0 0 8px}
.sres{list-style:none;margin:0;padding:0}
.sres li{border-bottom:1px solid #eee}
.sres a{display:block;padding:12px 0;text-decoration:none;color:#222}
.sres a:hover{text-decoration:none}
.st{font:normal 18px/1.35 Georgia,serif;color:#3d74a5}
.sres a:hover .st{color:#f57d00;text-decoration:underline}
.sd{font:12px Arial,Helvetica,sans-serif;color:#666;margin:3px 0;text-transform:uppercase;letter-spacing:.04em}
.sn{font:15px/1.5 Georgia,serif;color:#222;margin:4px 0 0}
mark{background:#fff3cd;color:inherit;padding:0 1px}

/* Lists, archive, write */
.list .it{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
  color:#222;
  text-decoration:none;
  gap:12px;
  font:15px Georgia,serif;
}
.list a.it:hover{text-decoration:none}
.list a.it:hover span:first-child{color:#f57d00}
.list .it span{flex:1;min-width:0}
.cnt{font:13px Arial,Helvetica,sans-serif;color:#666;flex:none}
.date{color:#666;font:12px Arial,Helvetica,sans-serif;letter-spacing:0;text-transform:none}
.more{color:#3d74a5;font:13px Arial,Helvetica,sans-serif;text-decoration:none}
.msg{font:13px Arial,Helvetica,sans-serif;color:#666;min-height:20px;margin-top:8px}
.mutd{color:#666;font-size:13px;font-family:Arial,Helvetica,sans-serif}
.dnote{
  font:13px Arial,Helvetica,sans-serif;
  background:#fff8e1;
  border:1px solid #e6d9a8;
  border-radius:0;
  padding:10px 12px;
  margin:0 0 14px;
}
.arch{font:14px/1.6 Arial,Helvetica,sans-serif}
.ya>summary,.ma>summary{
  cursor:pointer;
  padding:8px 0;
  font-weight:bold;
  list-style:none;
  display:flex;align-items:center;gap:8px;
  font-family:Arial,Helvetica,sans-serif;
}
.ya>summary::-webkit-details-marker,.ma>summary::-webkit-details-marker{display:none}
.ya .cnt,.ma .cnt{font-weight:normal;color:#666}
.ma>summary{font-weight:normal;padding:6px 0 6px 4px}
.arch ul{list-style:none;margin:0;padding:0 0 8px 12px}
.arch li{padding:3px 0}
.arch a{color:#3d74a5}
.yv .row h1{font-size:1.4rem;font-family:Arial,Helvetica,sans-serif;font-weight:bold}

/* Year at a glance */
.gy{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 18px;font:bold 1.15rem Arial,Helvetica,sans-serif}
.gyb{
  border:1px solid #ccc;background:#f0f0f0;color:#222;
  padding:6px;min-width:34px;min-height:34px;justify-content:center;border-radius:0;
}
.gyb:disabled{opacity:.4;cursor:default}
.yx{margin-left:auto}
.gms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px}
.gml{font:12px Arial,Helvetica,sans-serif;color:#666;margin:0 0 5px}
.gg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.gg a,.gg span{display:block;aspect-ratio:1;background:#eee}
.gg a{text-decoration:none}
.g0{background:#eee}
.g1{background:#9cb8d4}
.g2{background:#6a93b8}
.g3{background:#3d74a5}
.gg .td{outline:1px solid #222;outline-offset:0}
.gt{text-align:center;font:13px Arial,Helvetica,sans-serif;color:#666;margin:18px 0 0}

/* Forms / editor */
label.l,.l{
  display:block;
  font:12px Arial,Helvetica,sans-serif;
  color:#666;
  margin:12px 0 4px;
}
input,textarea,select{
  width:100%;
  font:15px/1.5 Georgia,"Times New Roman",Times,serif;
  color:#222;
  background:#fff;
  border:1px solid #ccc;
  border-radius:0;
  padding:8px 10px;
}
input:focus,textarea:focus{outline:1px solid #3d74a5;outline-offset:0}
#bo,textarea#bo{
  min-height:280px;
  font:16px/1.65 Georgia,"Times New Roman",Times,serif;
  resize:vertical;
  display:block;
}
.etabs{display:flex;gap:0;margin:8px 0 0;border-bottom:1px solid #ddd}
.etabs button{
  border:0;background:none;border-radius:0;
  padding:8px 14px;min-height:36px;
  color:#666;font:13px Arial,Helvetica,sans-serif;
}
.etabs button.on{color:#222;font-weight:bold;box-shadow:inset 0 -2px 0 #3d74a5}
.fmt{
  display:flex;flex-wrap:wrap;gap:1px;
  margin:8px 0;
  padding:3px;
  border:1px solid #ccc;
  border-radius:0;
  background:#fafafa;
}
.fmt button{
  margin:0;padding:0;
  width:36px;height:36px;
  border:0;background:none;
  color:#222;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:0;
}
.fmt button:hover,.fmt button:active{background:#eee}
.fmt .sep{width:1px;background:#ddd;margin:5px 3px;align-self:stretch;text-align:inherit;letter-spacing:0}
.fmt .i{width:16px;height:16px}
.fmt label.btn{
  margin:0;padding:0;width:36px;height:36px;border:0;
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border-radius:0;
}
.fmt label.btn:hover{background:#eee}
.pvw{border:1px solid #ccc;border-radius:0;padding:14px 16px;min-height:200px;background:#fff}
.coverbox img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.saved{font:12px Arial,Helvetica,sans-serif;color:#666}
.saved.on{color:#222}

/* Customize */
.cbox{border:1px solid #ddd;border-radius:0;padding:12px;margin-bottom:14px;background:#fff}
.cbox h4{margin:0 0 10px;font:bold 13px Arial,Helvetica,sans-serif;color:#222}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.skin{
  flex-direction:column;align-items:stretch;gap:6px;
  border-radius:0;padding:8px;
  border:1px solid #ddd;
  background:#fff;
  font:12px Arial,Helvetica,sans-serif;
}
.skin.on{outline:2px solid #3d74a5;outline-offset:0}
.sw{display:flex;height:20px;overflow:hidden;border:1px solid #ddd}
.sw i{flex:1}
.fonts{display:grid;gap:6px}
.fo{display:flex;align-items:center;gap:8px;font:14px Arial,Helvetica,sans-serif}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cc{display:flex;flex-direction:column;gap:4px;font:12px Arial,Helvetica,sans-serif;color:#666}
.cc input[type=color]{width:100%;height:34px;padding:1px;border:1px solid #ccc;background:#fff}
.adjf{width:180px;height:240px;margin:6px auto 0;overflow:hidden;border:1px solid #ccc;position:relative}
.adjf img{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.nudge{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.nudge button{padding:6px 10px;min-height:34px}
.meter{height:6px;background:#eee;margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;background:#3d74a5}

/* Profile page (still reachable) */

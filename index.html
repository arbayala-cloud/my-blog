  <div class="cbox"><h4>Divider between posts</h4><div class="fonts"><label class="fo"><input type="radio" name="dv" value="drawn" ${L.divider!=='line'?'checked':''}><span>Drawn icons</span></label><label class="fo"><input type="radio" name="dv" value="line" ${L.divider==='line'?'checked':''}><span>Simple line</span></label></div></div>

    <div class="row" style="margin:8px 0 0;justify-content:center"><span class="sans" style="font-size:11px">Zoom</span><input type="range" id="zm" min="1" max="3" step="0.05" style="width:160px;padding:0"></div>

    ${PFIELDS.map(([k,l])=>`<label class="l">${l}</label><input data-pf="${k}" value="${esc(F[k]||'')}">`).join('')}</div>
  <div class="row"><button class="pri" id="csv">Save</button><button id="crs">Reset to classic</button></div><div class="msg" id="msg"></div>`;
  let CM='L';const drawCC=()=>{const s=SKINS[L.skin||'classic'],base=CM==='D'?s.D:s.L,c=(L.colors||{})[CM]||{},defs={bg:base.bg,card:base.card,fg:base.fg,title:base.fg,acc:L.accent||base.lnk,bar:L.accent||base.bar};
    app.querySelectorAll('[data-cc]').forEach(i=>i.value=c[i.dataset.cc]||(CM==='D'&&!(L.colors||{}).D&&(L.colors||{}).L?'#222222':defs[i.dataset.cc]));

  setTimeout(()=>{$('#cmode').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;CM=b.dataset.m;$('#cmode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));setTheme(CM==='D'?'dark':'light');drawCC()};

    $('#ccx').onclick=()=>{delete L.colors;live()};drawCC()},0);
  app.querySelectorAll('.skin').forEach(b=>b.onclick=()=>{L.skin=b.dataset.sk;delete L.accent;$('#ac').value=SKINS[L.skin].L.bar;live()});

  $('#twc').onchange=e=>{if(e.target.checked)delete L.tw;else L.tw=false;live()};
  app.querySelectorAll('[name=dv]').forEach(r=>r.onchange=()=>{if(r.value==='line')L.divider='line';else delete L.divider;live()});
  app.querySelectorAll('[name=fo]').forEach(r=>r.onchange=()=>{L.font=r.value;live()});
  $('#st').oninput=e=>{L.subtitle=e.target.value.trim();live()};
  const up=async(f,pre)=>'drive:'+await mpUpload({name:pre+'-'+Date.now(),parents:['appDataFolder']},f,f.type||'application/octet-stream');
  $('#bn').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading banner';try{L.banner=await up(f,'banner');live();$('#msg').textContent='Banner ready. Tap Save to keep it.'}catch(x){$('#msg').textContent='Upload failed. Please try again.'}};
  $('#bnx').onclick=()=>{L.banner='none';live();$('#msg').textContent='Banner hidden. Tap Save to keep it.'};$('#bnd').onclick=()=>{delete L.banner;live();$('#msg').textContent='Default banner. Tap Save to keep it.'};
  let POS={x:50,y:25,z:1,...(PROFILE.photoPos||{})};const cl=v=>Math.max(0,Math.min(100,v));
  const drawPos=()=>{const i=$('#adjf img');if(i)i.setAttribute('style',pfStyle(POS));$('#zm').value=POS.z};drawPos();

  fr.addEventListener('pointermove',e=>{if(!drag)return;const w=fr.clientWidth,hh=fr.clientHeight;POS.x=cl(drag.px-(e.clientX-drag.x)/w*100/POS.z);POS.y=cl(drag.py-(e.clientY-drag.y)/hh*100/POS.z);drawPos()});
  fr.addEventListener('pointerup',()=>drag=null);fr.addEventListener('pointercancel',()=>drag=null);
  $('#zm').oninput=e=>{POS.z=+e.target.value;drawPos()};
  app.querySelector('.nudge').onclick=e=>{const b=e.target.closest('[data-n]');if(b){const [dx,dy]=b.dataset.n.split(',').map(Number);POS.x=cl(POS.x+dx);POS.y=cl(POS.y+dy);drawPos()}};
  $('#pcen').onclick=()=>{POS={x:50,y:25,z:1};drawPos()};
  let PHOTO=null;$('#pp2').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading photo';try{PHOTO=await up(f,'profile');POS={x:50,y:25,z:1};$('#adj').hidden=false;$('#adjf').innerHTML=imgTag(PHOTO,'',1);drawPos();$('#msg').textContent='Photo ready. Adjust it, then tap Save.'}catch(x){$('#msg').textContent='Upload failed. Please try again.'}};
  $('#csv').onclick=async()=>{const fields={};app.querySelectorAll('[data-pf]').forEach(i=>fields[i.dataset.pf]=i.value.trim());$('#msg').textContent='Saving';
    try{await change(a=>{PROFILE={...PROFILE,look:L,fields,photoPos:POS,...(PHOTO?{photo:PHOTO}:{})};return a});setLook(L);side();$('#msg').textContent='Saved'}catch(x){$('#msg').textContent='Could not save. Please try again.'}};
  $('#crs').onclick=()=>{if(!confirm('Reset skin, accent, font and header to classic?'))return;L={};live();custom();$('#msg').textContent='Reset. Tap Save to keep it.'}}
const SCR={};let BACKOK=false;addEventListener('hashchange',e=>{try{const o=new URL(e.oldURL).hash||'#/';const ip=/^#\/(p|post)\//.test(o);if(!ip)SCR[o]=scrollY;BACKOK=!ip;FROMPOST=ip}catch(x){}});let FROMPOST=false;
async function route(){if(!LS.getItem('blog.em')){signin();return}
  $('#mbtn').style.visibility='visible';if(!(tok&&Date.now()<tokExp-60000))needSync();
  const h=location.hash||'#/';let r='home';
  if(h.startsWith('#/page/'))home(h.slice(7));else if(h.startsWith('#/p/'))view(h.slice(4));else if(h.startsWith('#/post/'))view(h.slice(7));else if(h==='#/profile')profilePage(),r='profile';else if(h==='#/year')yearPage(),r='year';else if(h.startsWith('#/day/'))dayPage(h.slice(6));else if(h.startsWith('#/tag/'))tagPage(decodeURIComponent(h.slice(6))),r='tags';else if(h==='#/tags')tags(),r='tags';
  else if(h==='#/archive')archive(),r='archive';else if(h==='#/write')write(),r='write';else if(h==='#/search')search(),r='search';else if(h==='#/custom')custom(),r='custom';else home();
  side();document.querySelectorAll('.xbar a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r));const y=FROMPOST?SCR[h]:null;FROMPOST=false;scrollTo(0,0);if(y){let k=0;const t=()=>{if(document.documentElement.scrollHeight-innerHeight>=y-2||k++>40){scrollTo(0,y)}else setTimeout(t,50)};setTimeout(t,30)}}
$('#syncb').onclick=resync;app.addEventListener('click',async e=>{const b=e.target.closest('[data-gy]');if(!b)return;GY+=+b.dataset.gy;let d=[];try{d=await pub()}catch(x){}const g=$('#gl');if(g)g.innerHTML=glance(d,GY)});addEventListener('hashchange',route);route();

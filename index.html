<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashley's Blog</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json?v=2"><link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--fg:#111111;--mut:#6b6b6b;--acc:#111111;--acc2:#333333;--gold:#555555;--line:#e2e2e2;--chip:#f0f0f0}
[data-t=dark]{--bg:#000000;--card:#0d0d0d;--fg:#f2f2f2;--mut:#9a9a9a;--acc:#ffffff;--acc2:#dddddd;--gold:#bbbbbb;--line:#2a2a2a;--chip:#1c1c1c}
@media(prefers-color-scheme:dark){[data-t=system]{--bg:#000000;--card:#0d0d0d;--fg:#f2f2f2;--mut:#9a9a9a;--acc:#ffffff;--acc2:#dddddd;--gold:#bbbbbb;--line:#2a2a2a;--chip:#1c1c1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.75 Lora,Georgia,serif;transition:background .2s}
.sans{font-family:system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font:600 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:.02em}.brand img{width:30px;height:30px;border-radius:8px}
button,.btn{font:15px system-ui,sans-serif;background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}button.icon{border:0;padding:8px;color:var(--acc)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:680px;margin:0 auto;padding:22px 20px 90px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--acc);line-height:1.2}
.hero{text-align:center;padding:26px 6px 30px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.hero h1{font-size:40px;margin:6px 0 4px}.hero p{color:var(--mut);margin:8px auto 0;max-width:30em;font-style:italic}
.orn{display:block;margin:14px auto 0;width:140px;height:14px;color:var(--gold)}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}.menu.on{opacity:1;pointer-events:auto}
.menu nav{position:absolute;right:0;top:0;bottom:0;width:min(310px,86vw);background:var(--card);padding:20px 22px;padding-top:max(20px,env(safe-area-inset-top));display:flex;flex-direction:column;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s;overflow:auto}.menu.on nav{transform:none}
.menu nav a{color:var(--fg);text-decoration:none;font:17px system-ui,sans-serif;padding:13px 4px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}.menu nav a svg{color:var(--gold)}
.menu nav a.cur{color:var(--acc);font-weight:600}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;justify-content:center;padding:8px 6px}.seg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.post{padding:4px 0 28px;border-bottom:1px solid var(--line);margin-bottom:26px}.post h2{margin:0 0 4px;font-size:30px}.post h2 a{color:var(--acc);text-decoration:none}
.date{color:var(--mut);font:13px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.more{color:var(--gold);font:15px system-ui;text-decoration:none}
.body img{max-width:100%;height:auto;border-radius:14px;display:block;margin:16px 0}.body p{margin:0 0 1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}.chip{font:13px system-ui;background:var(--chip);color:var(--acc2);border-radius:999px;padding:3px 12px;text-decoration:none;border:0;cursor:pointer}
.chip.x{display:inline-flex;gap:6px;align-items:center}
.empty{color:var(--mut);text-align:center;padding:50px 0;font-family:system-ui}
label.l{display:block;font:14px system-ui;color:var(--mut);margin:16px 0 6px}
input,textarea{width:100%;font:17px/1.6 Lora,Georgia,serif;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}textarea{min-height:42vh;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}.list .it{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.list .it span{flex:1}.list a.it{color:var(--fg);text-decoration:none}.cnt{font:14px system-ui;color:var(--mut)}
.msg{font:14px system-ui;color:var(--mut);min-height:20px;margin-top:8px}.tag{font:12px system-ui;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
.pagehead{margin:4px 0 20px}.pagehead h1{font-size:34px;margin:0}.pagehead p{color:var(--mut);margin:4px 0 0;font:15px system-ui}
footer{text-align:center;color:var(--mut);font:13px system-ui;padding:10px 0 30px}

header.mast{position:static;display:block;text-align:center;background:var(--bg);border:0;padding:34px 18px 0;padding-top:max(34px,env(safe-area-inset-top))}
.mast .brand{display:inline-block;font:500 46px/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;color:var(--fg)}
.rule{height:1px;background:var(--line);max-width:680px;margin:18px auto 0}
.nav{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);max-width:680px;margin:0 auto;position:sticky;top:0}
.nav a{font:13px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-decoration:none;padding:4px 0;border-bottom:1px solid transparent}.nav a.cur{color:var(--fg);border-color:var(--fg)}
main{max-width:680px;padding:30px 20px 40px}
.post{padding:0 0 38px;margin-bottom:38px}.cover{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;margin:0 0 18px;background:var(--chip)}
.post h2{font-size:32px;margin:6px 0 6px;color:var(--fg)}.post h2 a{color:var(--fg)}.meta{color:var(--mut);font:12px system-ui;letter-spacing:.12em;text-transform:uppercase}
.excerpt{margin:10px 0 12px;color:var(--fg)}.more{color:var(--fg);font:13px system-ui;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--fg);padding-bottom:2px}
.sep{text-align:center;color:var(--mut);letter-spacing:.6em;margin:-14px 0 34px}
.full h1{font:500 42px/1.15 'Cormorant Garamond',Georgia,serif;margin:4px 0 10px;color:var(--fg)}.full .body{font-size:19px;line-height:1.85;margin-top:26px}
.body h3{font-size:26px;margin:1.6em 0 .4em;color:var(--fg)}.body img{margin:28px 0;border-radius:4px}
.body blockquote{margin:30px 0;padding:6px 0 6px 22px;border-left:2px solid var(--fg);font:italic 24px/1.5 'Cormorant Garamond',Georgia,serif}
.chip{border-radius:2px;letter-spacing:.06em}
.foot{max-width:680px;margin:0 auto;padding:0 20px 40px;text-align:center;color:var(--mut);font:12px system-ui}.foot .seg{max-width:300px;margin:22px auto 14px}
.fmt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.fmt button{padding:7px 12px;border-radius:6px}
.coverbox img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;display:block;margin-bottom:8px}
</style></head><body data-t="system">
<header class="mast"><a class="brand" href="#/">Ashley's Blog</a><div class="rule"></div>
<nav class="nav" id="mbtn"><a href="#/" data-r="home">Home</a><a href="#/tags" data-r="tags">Categories</a><a href="#/archive" data-r="archive">Archive</a><a href="#/write" data-r="write">Write</a></nav></header>
<main id="app"></main>
<footer class="foot"><div class="rule"></div><div class="seg" id="seg"><button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="system">System</button></div><div>Ashley's Blog &middot; Version 2026.10.31h</div></footer>
<script>
/* ===================================================== */

const CID='844979369291-3008v3sv7o2tv9ktuj8dccvd0khjdneh.apps.googleusercontent.com',SCOPE='https://www.googleapis.com/auth/drive.appdata openid email',FN='myblog-posts.json';
const LS=localStorage,DR='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files';
let tok=null,tokExp=0;try{const v=JSON.parse(LS.getItem('blog.tok')||'null');if(v&&v.e>Date.now()+60000){tok=v.t;tokExp=v.e}}catch(e){}
let gisP=null;function gis(){return gisP||(gisP=new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=1;s.onload=()=>ok();s.onerror=()=>{gisP=null;no(new Error('offline'))};document.head.appendChild(s)}))}
async function token(interactive){if(tok&&Date.now()<tokExp-60000)return tok;await gis();
 return new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),interactive?120000:15000);
  const tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPE,login_hint:LS.getItem('blog.em')||undefined,callback:async r=>{clearTimeout(t);if(r&&r.access_token){tok=r.access_token;tokExp=Date.now()+(r.expires_in||3600)*1000;LS.setItem('blog.tok',JSON.stringify({t:tok,e:tokExp}));
     if(!LS.getItem('blog.em')){try{const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();if(u.email)LS.setItem('blog.em',u.email)}catch(e){}}ok(tok)}else no(new Error(r&&r.error||'denied'))},error_callback:e=>{clearTimeout(t);no(new Error(e&&e.type||'failed'))}});
  tc.requestAccessToken({prompt:interactive&&!LS.getItem('blog.em')?'select_account':''})})}
function dropTok(){tok=null;tokExp=0;LS.removeItem('blog.tok')}
async function api(u,o={}){const t=await token(false);const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+t}});if(r.status===401){dropTok();throw new Error('auth')}if(!r.ok)throw new Error('http '+r.status);return r}
async function fileId(){let id=LS.getItem('blog.fid');if(id)return id;const r=await(await api(DR+'?spaces=appDataFolder&fields=files(id)&orderBy=modifiedTime desc&q='+encodeURIComponent("name='"+FN+"'"))).json();id=r.files&&r.files[0]&&r.files[0].id;if(id)LS.setItem('blog.fid',id);return id||null}
async function mpUpload(meta,blob,type){const b='blog'+Date.now(),pre='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: '+type+'\r\n\r\n';
  return (await(await api(UP+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:new Blob([pre,blob,'\r\n--'+b+'--'])})).json()).id}
const SEED=[{id:'eddb8fd3-d77a-4bee-8ebf-5df8ea1418eb',title:'Hi guys!',body:'Yada yada whoooo',tags:[],published:true,created_at:'2026-10-31T20:36:20.323Z',updated_at:'2026-10-31T20:36:18.589Z'}];
async function loadAll(){let id=await fileId();if(id){const r=await fetch(DR+'/'+id+'?alt=media',{headers:{Authorization:'Bearer '+await token(false)}});
    if(r.status===404){LS.removeItem('blog.fid');id=null}else if(r.status===401){dropTok();throw new Error('auth')}else if(!r.ok)throw new Error('http '+r.status);else{const d=await r.json();const p=(d.posts||[]).map(norm);LS.setItem('blog.cache',JSON.stringify(p));return p}}
  await saveAll(SEED);return SEED}
async function saveAll(posts){const body=JSON.stringify({app:'my-blog',v:1,saved:Date.now(),posts});const id=await fileId();
  if(id)await api(UP+'/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
  else{const nid=await mpUpload({name:FN,parents:['appDataFolder']},body,'application/json');LS.setItem('blog.fid',nid)}LS.setItem('blog.cache',JSON.stringify(posts))}
async function change(fn){const cur=await loadAll();const next=fn(cur.slice());await saveAll(next);CACHE=null;return next}
const IMG={};async function driveImg(id){if(!IMG[id]){IMG[id]=(async()=>{const r=await api(DR+'/'+id+'?alt=media');return URL.createObjectURL(await r.blob())})().catch(e=>{delete IMG[id];throw e})}return IMG[id]}
function loadImgs(){app.querySelectorAll('img[data-d]').forEach(i=>{const id=i.dataset.d;i.removeAttribute('data-d');driveImg(id).then(u=>i.src=u).catch(()=>{})})}
new MutationObserver(loadImgs).observe(document.getElementById('app'),{childList:true,subtree:true});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
const ORN='<svg class="orn" viewBox="0 0 140 14"><path d="M2 7h52M86 7h52" stroke="currentColor" stroke-width="1"/><path d="M70 1l6 6-6 6-6-6z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="58" cy="7" r="1.5" fill="currentColor"/><circle cx="82" cy="7" r="1.5" fill="currentColor"/></svg>';
const imgTag=(u,a)=>u.startsWith('drive:')?`<img data-d="${esc(u.slice(6))}" alt="${esc(a||'')}" loading="lazy">`:`<img src="${esc(u)}" alt="${esc(a||'')}" loading="lazy">`;
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
const IMGRE=/!\[(.*?)\]\(((?:https:\/\/|drive:)[^\s)]+)\)/g;
function render(b){return String(b||'').split(/\n{2,}/).map(p=>{p=p.trim();const m=p.match(/^!\[(.*?)\]\(((?:https:\/\/|drive:)[^\s)]+)\)$/);if(m)return imgTag(m[2],m[1]);
  if(/^##\s/.test(p))return '<h3>'+inl(esc(p.replace(/^##\s+/,'')))+'</h3>';
  if(/^>\s?/.test(p))return '<blockquote>'+inl(esc(p.replace(/^>\s?/gm,''))).replace(/\n/g,'<br>')+'</blockquote>';
  return '<p>'+inl(esc(p)).replace(IMGRE,(x,a,u)=>imgTag(u,a)).replace(/\n/g,'<br>')+'</p>'}).join('')}
const plain=b=>String(b||'').replace(/!\[.*?\]\(.*?\)/g,'').replace(/[*#>]/g,'').replace(/\s+/g,' ').trim();
const rt=b=>Math.max(1,Math.round(plain(b).split(' ').length/200))+' min read';
const coverOf=p=>p.cover||(String(p.body).match(/!\[.*?\]\(((?:https:\/\/|drive:)[^\s)]+)\)/)||[])[1];
const coverTag=u=>u?imgTag(u,'').replace('<img ','<img class="cover" '):'';
const chips=t=>(t&&t.length)?'<div class="chips">'+t.map(x=>`<a class="chip" href="#/tag/${encodeURIComponent(x)}">${esc(x)}</a>`).join('')+'</div>':'';
function setTheme(v){document.body.dataset.t=v;localStorage.blogTheme=v;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const dark=v==='dark'||(v==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name=theme-color]').content=dark?'#000000':'#ffffff'}
setTheme(localStorage.blogTheme||'system');$('#seg').onclick=e=>{if(e.target.dataset.v)setTheme(e.target.dataset.v)};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTheme(localStorage.blogTheme||'system'));
function norm(p){const m=String(p.body||'').match(/^<!--tags:(.*?)-->\n?/);return {...p,tags:m?m[1].split(',').map(s=>s.trim()).filter(Boolean):(Array.isArray(p.tags)?p.tags:[]),body:m?p.body.slice(m[0].length):(p.body||'')}}
let CACHE=null;
const byDate=a=>a.slice().sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
async function all(){if(CACHE)return CACHE;CACHE=byDate(await loadAll());return CACHE}
async function pub(){return (await all()).filter(p=>p.published)}
function card(p){const t=plain(p.body),ex=t.length>260?t.slice(0,260).replace(/\s\S*$/,'')+'...':t;
  return `<article class="post">${coverOf(p)?`<a href="#/p/${p.id}">${coverTag(coverOf(p))}</a>`:''}<div class="meta">${fmt(p.created_at)} &middot; ${rt(p.body)}</div><h2><a href="#/p/${p.id}">${esc(p.title)||'Untitled'}</a></h2>${chips(p.tags)}<p class="excerpt">${esc(ex)}</p><a class="more" href="#/p/${p.id}">Continue reading</a></article><div class="sep">&middot; &middot; &middot;</div>`}
const head=(t,s)=>`<div class="pagehead"><h1>${esc(t)}</h1>${s?`<p>${s}</p>`:''}</div>`;
const fail='<div class="empty">Posts could not load. Please try again.</div>';
async function home(){app.innerHTML=`<div id="pl" class="empty">Loading</div>`;
  try{const d=await pub();$('#pl').outerHTML=d.length?d.map(card).join(''):'<div class="empty">No posts yet.</div>'}catch(e){$('#pl').outerHTML=fail}}
async function tagPage(t){try{const d=(await pub()).filter(p=>p.tags.includes(t));app.innerHTML=head(t,d.length+(d.length===1?' post':' posts')+' &middot; <a class="more" href="#/tags">All categories</a>')+d.map(card).join('')}catch(e){app.innerHTML=fail}}
async function tags(){try{const c={};(await pub()).forEach(p=>p.tags.forEach(t=>c[t]=(c[t]||0)+1));const k=Object.keys(c).sort((a,b)=>a.localeCompare(b));
  app.innerHTML=head('Categories')+(k.length?'<div class="list">'+k.map(t=>`<a class="it" href="#/tag/${encodeURIComponent(t)}"><span>${esc(t)}</span><span class="cnt" style="flex:none">${c[t]}</span></a>`).join('')+'</div>':'<div class="empty">No categories yet.</div>')}catch(e){app.innerHTML=fail}}
async function archive(){try{const d=await pub(),g={};d.forEach(p=>{const k=new Date(p.created_at).toLocaleDateString(undefined,{year:'numeric',month:'long'});(g[k]=g[k]||[]).push(p)});
  app.innerHTML=head('Archive')+(d.length?Object.entries(g).map(([m,ps])=>`<h3 style="margin:22px 0 4px;font-size:24px">${esc(m)} <span class="cnt">${ps.length}</span></h3><div class="list">${ps.map(p=>`<a class="it" href="#/p/${p.id}"><span>${esc(p.title)||'Untitled'}</span><span class="cnt" style="flex:none">${new Date(p.created_at).getDate()}</span></a>`).join('')}</div>`).join(''):'<div class="empty">No posts yet.</div>')}catch(e){app.innerHTML=fail}}
async function view(id){let data=null;try{data=(await all()).find(p=>p.id===id)}catch(e){}
  app.innerHTML=data?`<article class="full"><div class="meta">${fmt(data.created_at)} &middot; ${rt(data.body)}</div><h1>${esc(data.title)||'Untitled'}</h1>${chips(data.tags)}${data.cover?`<div style="margin-top:22px">${coverTag(data.cover)}</div>`:''}<div class="body">${render(data.body)}</div></article><div class="sep" style="margin:40px 0 20px">&middot; &middot; &middot;</div><p style="text-align:center"><a class="more" href="#/">All posts</a></p>`:'<div class="empty">Post not found.</div>';scrollTo(0,0)}
let HASTAGS=true,ALL=[];
async function write(){let error=null;try{ALL=await all()}catch(x){error=x;ALL=[]}
  
  app.innerHTML=`<div class="row" style="margin:0 0 10px;justify-content:space-between"><h1 style="margin:0;font-size:34px">Your posts</h1><button class="pri" id="nw"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New post</button></div>
  <div class="list">${error?'<div class="msg">Could not load your posts. Check your connection.</div>':(ALL.map(p=>`<div class="it"><span>${esc(p.title)||'Untitled'}${p.published?'':'<span class="tag">Draft</span>'}<br><small class="date">${fmt(p.created_at)}</small></span><button data-e="${p.id}">Edit</button></div>`).join('')||'<div class="empty">No posts yet.</div>')}</div>
  <div class="row"><button id="bk"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download all posts</button><button id="so">Sign out</button></div>
`;
  $('#nw').onclick=()=>edit();$('#so').onclick=()=>{if(!confirm('Sign out of your blog on this device?'))return;try{google.accounts.oauth2.revoke(tok,()=>{})}catch(e){}dropTok();['blog.em','blog.fid','blog.cache'].forEach(k=>LS.removeItem(k));CACHE=null;location.hash='#/';route()};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(ALL.find(p=>p.id===b.dataset.e)));
  $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),posts:ALL},null,2)],{type:'application/json'}));a.download='blog-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}}
function edit(p){p=p||{title:'',body:'',published:true,tags:[]};let COVER=p.cover||'';let T=[...(p.tags||[])];
  const known=[...new Set(ALL.flatMap(x=>x.tags||[]))].sort();
  app.innerHTML=`<label class="l">Title</label><input id="ti" value="${esc(p.title)}">
  ${HASTAGS?`<label class="l">Tags</label><div class="chips" id="tc"></div><input id="tg" list="tl" placeholder="Type a tag and press Enter"><datalist id="tl">${known.map(t=>`<option value="${esc(t)}">`).join('')}</datalist><div class="chips" id="sug"></div>`:''}
  <label class="l">Cover photo (optional)</label><div class="coverbox" id="cvb"></div><div class="row" style="margin-top:0"><label class="btn" style="margin:0"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 15l5-4 4 3 3-2 4 3"/><circle cx="15" cy="9" r="1.5"/></svg><span id="cvl">Choose cover</span><input type="file" accept="image/*" id="cv" hidden></label><button id="cvx" hidden>Remove cover</button></div>
  <label class="l">Post</label><div class="fmt"><button data-f="b" aria-label="Bold"><b>B</b></button><button data-f="i" aria-label="Italic"><i>I</i></button><button data-f="h" aria-label="Heading"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M6 12h12"/></svg></button><button data-f="q" aria-label="Quote"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-2 5-4 6M14 7h4v4c0 3-2 5-4 6"/></svg></button><label class="btn" style="margin:0;padding:7px 12px;border-radius:6px" aria-label="Image"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 15l5-4 4 3 3-2 4 3"/><circle cx="15" cy="9" r="1.5"/></svg><input type="file" accept="image/*" id="ph2" hidden></label></div><textarea id="bo" placeholder="Write here. Leave a blank line between paragraphs.">${esc(p.body)}</textarea>
  <div class="row"><label class="btn" style="margin:0"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 15l5-4 4 3 3-2 4 3"/><circle cx="15" cy="9" r="1.5"/></svg>Add photo<input type="file" accept="image/*" id="ph" hidden></label>
  <label class="sans" style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" id="pb" style="width:auto" ${p.published?'checked':''}>Published</label></div>
  <div class="row"><button class="pri" id="sv">Save</button><button id="cx">Cancel</button>${p.id?'<button id="dl" style="margin-left:auto">Delete</button>':''}</div><div class="msg" id="msg"></div>`;
  if(HASTAGS){const draw=()=>{$('#tc').innerHTML=T.map((t,i)=>`<button class="chip x" data-i="${i}">${esc(t)}<svg class="i" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`).join('');
      $('#sug').innerHTML=known.filter(t=>!T.includes(t)).map(t=>`<button class="chip" data-a="${esc(t)}" style="background:none;border:1px dashed var(--line)">+ ${esc(t)}</button>`).join('')};
    const add=v=>{v=v.replace(/,|-->|<!--/g,' ').trim().replace(/\s+/g,' ');if(v&&!T.some(t=>t.toLowerCase()===v.toLowerCase()))T.push(v);$('#tg').value='';draw()};
    $('#tg').onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add($('#tg').value)}};$('#tg').onchange=()=>add($('#tg').value);
    $('#tc').onclick=e=>{const b=e.target.closest('[data-i]');if(b){T.splice(+b.dataset.i,1);draw()}};$('#sug').onclick=e=>{const b=e.target.closest('[data-a]');if(b)add(b.dataset.a)};draw()}
  const drawCv=()=>{$('#cvb').innerHTML=COVER?imgTag(COVER,''):'';$('#cvx').hidden=!COVER;$('#cvl').textContent=COVER?'Change cover':'Choose cover'};drawCv();
  const upImg=async f=>{const id=await mpUpload({name:'img-'+Date.now()+'-'+f.name.replace(/[^\w.]+/g,'_'),parents:['appDataFolder']},f,f.type||'application/octet-stream');return 'drive:'+id};
  $('#cv').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading cover';try{COVER=await upImg(f);drawCv();$('#msg').textContent='Cover added'}catch(x){$('#msg').textContent='Cover upload failed. Please try again.'}};
  $('#cvx').onclick=()=>{COVER='';drawCv()};
  $('#ph2').onchange=e=>{$('#ph').onchange({target:e.target})};
  app.querySelector('.fmt').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;const t=$('#bo'),s=t.selectionStart,en=t.selectionEnd,sel=t.value.slice(s,en)||'text',f=b.dataset.f;
    const out=f==='b'?'**'+sel+'**':f==='i'?'*'+sel+'*':f==='h'?'\n\n## '+sel+'\n\n':'\n\n> '+sel+'\n\n';t.value=t.value.slice(0,s)+out+t.value.slice(en);t.focus();t.selectionStart=t.selectionEnd=s+out.length};
  $('#cx').onclick=write;
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#msg').textContent='Uploading photo';
    try{const id=await mpUpload({name:'img-'+Date.now()+'-'+f.name.replace(/[^\w.]+/g,'_'),parents:['appDataFolder']},f,f.type||'application/octet-stream');
    const t=$('#bo'),i=t.selectionStart;t.value=t.value.slice(0,i)+'\n\n![](drive:'+id+')\n\n'+t.value.slice(i);$('#msg').textContent='Photo added'}catch(x){$('#msg').textContent='Photo upload failed. Please try again.'}};
  $('#sv').onclick=async()=>{if($('#tg').value.trim())add($('#tg').value);$('#msg').textContent='Saving';
    const row={title:$('#ti').value.trim(),body:$('#bo').value,cover:COVER,tags:T,published:$('#pb').checked,updated_at:new Date().toISOString()};
    try{await change(a=>{const i=a.findIndex(x=>x.id===p.id);if(p.id&&i>=0)a[i]={...a[i],...row};else a.push({id:crypto.randomUUID(),created_at:new Date().toISOString(),...row});return a});write()}catch(x){$('#msg').textContent='Could not save. Your text is still here; please try again.'}};
  if(p.id)$('#dl').onclick=async()=>{if(!confirm('Delete this post?'))return;try{await change(a=>a.filter(x=>x.id!==p.id));write()}catch(x){$('#msg').textContent='Could not delete. Please try again.'}}}
function signin(msg){$('#mbtn').style.visibility='hidden';app.innerHTML=head('Ashley\'s Blog')+`<p class="sans" style="color:var(--mut)">${msg||'Private. Sign in to continue.'}</p><div class="row"><button class="pri" id="gs"><svg class="i" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.5 9.6 4.5 4.5 0 0 0 7 18.5z"/></svg>${LS.getItem('blog.em')?'Continue':'Sign in with Google'}</button></div><div class="msg" id="msg"></div>`;
  $('#gs').onclick=async()=>{$('#msg').textContent='Opening Google';try{await token(true);CACHE=null;route()}catch(e){$('#msg').textContent=e.message==='offline'?'You appear to be offline.':'Sign-in did not finish. Please try again.'}}}
async function route(){if(!LS.getItem('blog.em')){signin();return}
  try{await token(false)}catch(e){signin(e.message==='offline'?'You appear to be offline.':'Tap Continue to open your blog.');return}$('#mbtn').style.visibility='visible';
  const h=location.hash||'#/';let r='home';
  if(h.startsWith('#/p/'))view(h.slice(4));else if(h.startsWith('#/tag/'))tagPage(decodeURIComponent(h.slice(6))),r='tags';else if(h==='#/tags')tags(),r='tags';
  else if(h==='#/archive')archive(),r='archive';else if(h==='#/write')write(),r='write';else home();
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('cur',a.dataset.r===r));scrollTo(0,0)}
addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>

name: Keep Supabase awake
on:
  schedule: [{cron: '17 14 */3 * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pbkrwghuwqufosodcxtw.supabase.co/rest/v1/posts?select=id&limit=1" -H "apikey: sb_publishable_bzFGyPbxFyfgU4CQ72ryuQ_S4vwUvt2")
          echo "status $code"; test "$code" = 200

name: Weekly blog backup
on:
  schedule: [{cron: '23 15 * * 0'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 backup/backup.py
      - run: |
          git config user.name Brock; git config user.email brock@local
          git add backup
          git diff --cached --quiet || (git commit -m "Weekly backup $(date -u +%F)" && git push)
